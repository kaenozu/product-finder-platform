name: Rakuten formatter diagnostic

on:
  push:
    branches:
      - feat/rakuten-aggregate-offer-contract

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write src/worker/adapters/rakuten-product.ts tests/unit/rakuten-product-adapter.test.ts
          git diff -- src/worker/adapters/rakuten-product.ts tests/unit/rakuten-product-adapter.test.ts
