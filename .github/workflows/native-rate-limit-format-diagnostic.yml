name: Native rate-limit format diagnostic

on:
  pull_request:
    paths:
      - "docs/native-rate-limit-migration.md"
      - ".github/workflows/native-rate-limit-format-diagnostic.yml"

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        run: |
          pnpm exec prettier --write docs/native-rate-limit-migration.md
          git diff -- docs/native-rate-limit-migration.md
          test -n "$(git diff -- docs/native-rate-limit-migration.md)"
